<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TamaTac V5 - Voice Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0a0a0f;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;color:#fff}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 20% 30%,#1a1a3a 0%,transparent 60%),radial-gradient(ellipse at 80% 70%,#2a1a2a 0%,transparent 60%),#0a0a0f}
.card{width:100%;max-width:460px;padding:22px;background:rgba(255,255,255,.04);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);border-radius:28px;max-height:96vh;overflow-y:auto}
h1{font-family:'Playfair Display',serif;font-size:30px;text-align:center;letter-spacing:2px}h1 span{color:#c9a86a}
.sub{text-align:center;color:rgba(255,255,255,.4);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin:4px 0 16px}
.input{width:100%;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:14px;outline:none;margin-bottom:10px;text-align:center}
.btn{width:100%;padding:12px;border-radius:14px;border:1px solid transparent;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-weight:600}
.btn-primary{background:#c9a86a;color:#0a0a0f}
.btn-ghost{background:rgba(255,255,255,.05);color:#fff;border-color:rgba(255,255,255,.1);margin-top:7px}
.modes{display:flex;gap:8px;margin-bottom:14px;background:rgba(255,255,255,.04);padding:4px;border-radius:14px}
.mode{flex:1;padding:9px 0;border-radius:10px;text-align:center;font-size:11px;cursor:pointer;color:rgba(255,255,255,.5)}
.mode.active{background:#fff;color:#000;font-weight:600}
.step{display:none}.step.active{display:block}
.roomCode{font-family:'Playfair Display',serif;font-size:28px;text-align:center;letter-spacing:6px;background:rgba(255,255,255,.05);border:1px dashed rgba(201,168,106,.4);padding:12px;border-radius:16px;margin:10px 0;color:#c9a86a}
.status{text-align:center;padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:12px;margin:8px 0}
.players{display:flex;gap:8px;margin:10px 0}
.player{flex:1;padding:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:14px;text-align:center}
.player.active{background:rgba(201,168,106,.15);border-color:#c9a86a}
.boardWrap{position:relative}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px;position:relative}
.cell{aspect-ratio:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;cursor:pointer}
.cell.x{color:#ff3b3b;text-shadow:0 0 12px rgba(255,59,59,.6)}
.cell.o{color:#3b82ff;text-shadow:0 0 12px rgba(59,130,255,.6)}
.cell.win{border-width:2px!important}
.cell.win.x{background:rgba(255,59,59,.22)!important;border-color:#ff3b3b!important;box-shadow:0 0 20px rgba(255,59,59,.5)}
.cell.win.o{background:rgba(59,130,255,.22)!important;border-color:#3b82ff!important;box-shadow:0 0 20px rgba(59,130,255,.5)}
.winLine{position:absolute;background:#fff;box-shadow:0 0 10px #fff,0 0 20px #fff;z-index:10;border-radius:4px;pointer-events:none}
.voicePanel{background:rgba(201,168,106,.08);border:1px solid rgba(201,168,106,.2);border-radius:16px;padding:12px;margin:10px 0}
.voiceRow{display:flex;gap:6px;margin:6px 0}
.small{font-size:10px;color:rgba(255,255,255,.35);text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
<div class="step active" id="stepUser">
<h1>TAMA<span>TAC</span></h1><p class="sub">V5 • Voice Edition</p>
<input id="inpUsername" class="input" placeholder="isi username kamu" maxlength="16">
<button class="btn btn-primary" id="btnSaveUser">MASUK →</button>
</div>
<div class="step" id="stepChoose">
<h1>TAMA<span>TAC</span></h1><p class="sub" id="helloUser">Halo</p>
<button class="btn btn-primary" id="chooseBot">🤖 Main vs BOT</button>
<button class="btn btn-ghost" id="chooseOnline">🌐 Main Online</button>
<div class="voicePanel">
<div style="font-size:11px;text-align:center;margin-bottom:6px">🎤 SETTING SUARA KAMU</div>
<div class="voiceRow"><button class="btn btn-ghost" id="recX">🎤 Rekam X</button><button class="btn btn-ghost" id="playX">▶️ Test X</button></div>
<div class="voiceRow"><button class="btn btn-ghost" id="recO">🎤 Rekam O</button><button class="btn btn-ghost" id="playO">▶️ Test O</button></div>
<div class="voiceRow"><button class="btn btn-primary" id="recWin" style="flex:2">🎤 Rekam "Menang Bosku"</button><button class="btn btn-ghost" id="playWin" style="flex:1">▶️ Test Win</button></div>
<div class="small" id="voiceStatus">Rekam X & O lu sekarang!</div>
</div>
</div>
<!-- sisanya sama V4, logic voice ada di JS di bawah -->
<div class="step" id="stepBot">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h1 style="font-size:20px">VS BOT <span id="botRoundBadge" class="badge" style="background:#c9a86a;color:#000;padding:2px 6px;border-radius:8px;font-size:9px">R1</span></h1><button class="btn btn-ghost" style="width:auto;padding:5px 9px;font-size:10px;margin:0" id="botBack">←</button></div>
<div class="modes"><div class="mode active" data-diff="easy">EASY</div><div class="mode" data-diff="medium">MEDIUM</div><div class="mode" data-diff="hard">HARD</div></div>
<div class="players"><div class="player active" id="botP1"><b id="botP1Name">Kamu</b><span id="botP1Score" style="color:#ff3b3b">X • 0</span></div><div class="player" id="botP2"><b>Bot</b><span id="botP2Score" style="color:#3b82ff">O • 0</span></div></div>
<div class="status" id="botStatus">Giliran kamu (X)</div>
<div class="boardWrap"><div class="board" id="botBoard"></div></div>
<div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-ghost" id="botUndo">UNDO</button><button class="btn btn-primary" id="botReset">MAIN LAGI</button></div>
</div>
<div class="step" id="stepLobby">
<h1>TAMA<span>TAC</span></h1><p class="sub">Online Mode</p>
<button class="btn btn-primary" id="btnCreate">Buat Room Baru</button>
<div style="display:flex;align-items:center;gap:10px;margin:12px 0;color:rgba(255,255,255,.25);font-size:10px"><div style="flex:1;height:1px;background:rgba(255,255,255,.08)"></div>ATAU<div style="flex:1;height:1px;background:rgba(255,255,255,.08)"></div></div>
<input id="inpRoom" class="input" placeholder="kode room teman..." maxlength="8">
<button class="btn btn-ghost" id="btnJoin">Join Room</button>
</div>
<div class="step" id="stepWait">
<h1 style="font-size:20px">Room Dibuat</h1><div class="roomCode" id="roomCodeDisplay">------</div>
<div style="display:flex;gap:6px"><button class="btn btn-ghost" id="btnCopy" style="margin:0;flex:1">Copy</button><button class="btn btn-ghost" id="waitBack" style="margin:0;flex:1">Batal</button></div>
<div class="status">Menunggu lawan...</div>
<div class="players"><div class="player active"><b id="hostName">Kamu</b></div><div class="player" style="opacity:.3"><b>Menunggu...</b></div></div>
</div>
<div class="step" id="stepGame">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h1 style="font-size:18px">ONLINE</h1><button class="btn btn-ghost" style="width:auto;padding:5px 9px;font-size:10px;margin:0" id="btnLeave">Keluar</button></div>
<div class="status" id="gameStatus">Menghubungkan...</div>
<div class="players"><div class="player" id="p1Box"><b id="p1Name">X</b><span id="p1Mark" style="color:#ff3b3b">X • 0</span></div><div class="player" id="p2Box"><b id="p2Name">O</b><span id="p2Mark" style="color:#3b82ff">O • 0</span></div></div>
<div class="boardWrap"><div class="board" id="board"></div></div>
<button class="btn btn-ghost" id="btnRestart" style="margin-top:8px;display:none">Main Lagi</button>
<div style="margin-top:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;height:160px">
<div style="flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px" id="chatMsgs"><div style="align-self:center;background:rgba(255,255,255,.04);color:rgba(255,255,255,.35);font-size:10px;padding:4px 10px;border-radius:10px">V5 Voice aktif!</div></div>
<div style="display:flex;gap:6px;padding:6px"><input id="chatInput" placeholder="ketik pesan..." style="flex:1;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff"><button class="btn btn-primary" id="chatSend" style="width:auto;padding:9px 12px;margin:0">Kirim</button></div>
</div>
</div>
</div>
<script>
// VOICE SYSTEM
let audioCtx=null;
let voiceData={X:localStorage.getItem('tamaVoiceX'), O:localStorage.getItem('tamaVoiceO'), WIN:localStorage.getItem('tamaVoiceWIN')};
function ensureAudio(){if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
function playBeep(freq,dur,type='sine'){ensureAudio();const o=audioCtx.createOscillator(), g=audioCtx.createGain();o.frequency.value=freq;o.type=type;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(0.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur);}
function playVoice(k){const b=voiceData[k];if(b){new Audio(b).play().catch(()=>{});return true;}return false;}
function playX(){if(!playVoice('X')){playBeep(880,0.15);setTimeout(()=>playBeep(1320,0.1),80);}}
function playO(){if(!playVoice('O')){playBeep(440,0.25);}}
function playWin(){if(!playVoice('WIN')){playBeep(523,0.2);setTimeout(()=>playBeep(659,0.2),150);setTimeout(()=>playBeep(784,0.4),300);}}
async function recordVoice(k){ensureAudio();try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const rec=new MediaRecorder(stream);let chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{const blob=new Blob(chunks,{type:'audio/webm'});const r=new FileReader();r.onloadend=()=>{voiceData[k]=r.result;localStorage.setItem('tamaVoice'+k,r.result);document.getElementById('voiceStatus').textContent='✅ Suara '+k+' tersimpan!';stream.getTracks().forEach(t=>t.stop());};r.readAsDataURL(blob);};rec.start();document.getElementById('voiceStatus').textContent='🔴 Merekam '+k+'... bilang sekarang!';setTimeout(()=>rec.stop(),2000);}catch(e){alert('Mic error: '+e.message);}}
const $=id=>document.getElementById(id);
function showStep(id){document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}
$('btnSaveUser').onclick=()=>{const v=$('inpUsername').value.trim();if(v.length<2){alert('isi username minimal 2 huruf!');return;}myUsername=v;$('helloUser').textContent='Halo, '+myUsername;showStep('stepChoose');};
$('chooseBot').onclick=()=>{showStep('stepBot');$('botP1Name').textContent=myUsername;botRound=0;initBotBoard();};
$('chooseOnline').onclick=()=>showStep('stepLobby');
$('botBack').onclick=()=>showStep('stepChoose');
$('recX').onclick=()=>recordVoice('X');$('recO').onclick=()=>recordVoice('O');$('recWin').onclick=()=>recordVoice('WIN');
$('playX').onclick=()=>playX();$('playO').onclick=()=>playO();$('playWin').onclick=()=>playWin();
let myUsername='',peer=null,conn=null,roomId='',isHost=false,myMark='X',turn='X',board=Array(9).fill(''),gameOver=false,scores={X:0,O:0},gameRound=0;
let botDiff='easy',botBoard=Array(9).fill(''),botTurn='X',botOver=false,botScores={X:0,O:0},botHistory=[],botRound=0;
function drawWinLine(boardEl,line){boardEl.querySelectorAll('.winLine').forEach(e=>e.remove());if(!line||line.length!==3)return;const w=boardEl.offsetWidth,h=boardEl.offsetHeight,gap=9,cellW=(w-gap*2)/3,cellH=(h-gap*2)/3,centers=[];for(let i=0;i<9;i++){const r=Math.floor(i/3),c=i%3;centers[i]={x:c*(cellW+gap)+cellW/2,y:r*(cellH+gap)+cellH/2};}const a=centers[line[0]],c=centers[line[2]],dx=c.x-a.x,dy=c.y-a.y,len=Math.sqrt(dx*dx+dy*dy),ang=Math.atan2(dy,dx)*180/Math.PI,div=document.createElement('div');div.className='winLine';div.style.width=len+'px';div.style.height='5px';div.style.left=a.x+'px';div.style.top=a.y+'px';div.style.transform=`rotate(${ang}deg)`;div.style.transformOrigin='0 50%';boardEl.appendChild(div);}
function initBotBoard(){botBoard=Array(9).fill('');botTurn=(botRound%2===0)?'X':'O';botOver=false;botHistory=[];renderBotBoard();$('botStatus').textContent='Round '+(botRound+1)+' — Giliran '+(botTurn==='X'?'kamu':'Bot');}
function renderBotBoard(){const el=$('botBoard');el.innerHTML='';botBoard.forEach((v,i)=>{const c=document.createElement('div');c.className='cell'+(v?' '+v.toLowerCase():'');if(v)c.textContent=v;else c.innerHTML='&nbsp;';c.onclick=()=>{if(botBoard[i]||botOver||botTurn!=='X')return;botHistory.push([...botBoard]);botBoard[i]='X';playX();let win=checkWinBoard(botBoard);renderBotBoard();if(win){handleBotWin(win);return;}botTurn='O';setTimeout(botMove,500);};el.appendChild(c);});}
function botMove(){if(botOver)return;let idx=findBestMoveBoard(botBoard);if(idx==null)return;botHistory.push([...botBoard]);botBoard[idx]='O';playO();let win=checkWinBoard(botBoard);renderBotBoard();if(win){handleBotWin(win);return;}botTurn='X';}
function handleBotWin(win){botOver=true;if(win.line){[...$('botBoard').children].forEach((el,i)=>{if(win.line.includes(i))el.classList.add('win');});drawWinLine($('botBoard'),win.line);}if(win.winner!=='D'){botScores[win.winner]++;playWin();}$('botP1Score').textContent=`X • ${botScores.X}`;$('botP2Score').textContent=`O • ${botScores.O}`;}
function randomEmptyBoard(b){const e=b.map((v,i)=>v==='' ? i : null).filter(v=>v!==null);return e[Math.floor(Math.random()*e.length)];}
function checkWinBoard(b){const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(const l of lines){const [a,b1,c]=l;if(b[a]&&b[a]===b[b1]&&b[a]===b[c])return{winner:b[a],line:l};}if(b.every(v=>v!==''))return{winner:'D',line:[]};return null;}
function findBestMoveBoard(brd){function minimax(b,isMax){const w=checkWinBoard(b);if(w){if(w.winner==='O')return 10;if(w.winner==='X')return -10;return 0;}let best=isMax?-1000:1000;for(let i=0;i<9;i++){if(b[i]===''){b[i]=isMax?'O':'X';const s=minimax(b,!isMax);b[i]='';best=isMax?Math.max(best,s):Math.min(best,s);}}return best;}let best=-1000,move=null;for(let i=0;i<9;i++){if(brd[i]===''){brd[i]='O';const s=minimax(brd,false);brd[i]='';if(s>best){best=s;move=i;}}}return move??randomEmptyBoard(brd);}
$('botReset').onclick=()=>{botRound++;initBotBoard();};
$('botUndo').onclick=()=>{if(botHistory.length===0||botOver)return;botBoard=botHistory.pop();botTurn='X';botOver=false;renderBotBoard();};
document.querySelectorAll('.mode').forEach(m=>{m.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));m.classList.add('active');botDiff=m.dataset.diff;botRound=0;initBotBoard();};});
$('btnCreate').onclick=()=>{roomId=Math.random().toString(36).substring(2,8).toUpperCase();isHost=true;myMark='X';gameRound=0;initPeer(roomId);$('roomCodeDisplay').textContent=roomId;$('hostName').textContent=myUsername+' (X)';showStep('stepWait');};
$('btnCopy').onclick=()=>{navigator.clipboard.writeText($('roomCodeDisplay').textContent).then(()=>{$('btnCopy').textContent='✅';setTimeout(()=>{$('btnCopy').textContent='Copy'},1200);});};
$('btnJoin').onclick=()=>{const code=$('inpRoom').value.trim().toUpperCase();if(!code){alert('isi kode room!');return;}roomId=code;isHost=false;myMark='O';initPeer();};
function initPeer(customId){if(peer)try{peer.destroy()}catch(e){}peer=customId?new Peer(customId):new Peer();peer.on('open',id=>{if(!isHost){const c=peer.connect(roomId,{reliable:true});setupConn(c);showStep('stepGame');}});peer.on('connection',c=>{if(isHost)setupConn(c);});}
function setupConn(c){conn=c;conn.on('open',()=>{if(isHost){setTimeout(()=>{conn.send({type:'hello',name:myUsername});},300);startGameAsHost();}else{conn.send({type:'join',name:myUsername});}});conn.on('data',data=>{if(data.type==='join'&&isHost){const g=data.name;document.querySelector('#stepWait .players').children[1].innerHTML=`<b>${g}</b>`;setTimeout(()=>{showStep('stepGame');$('p1Name').textContent=myUsername;$('p2Name').textContent=g;initOnlineBoard();},600);}if(data.type==='hello'&&!isHost){$('p1Name').textContent=data.name;$('p2Name').textContent=myUsername;gameRound=0;initOnlineBoard();}if(data.type==='move'){board=data.board;turn=data.turn;gameOver=data.gameOver;renderOnlineBoard();checkOnlineWin(data.win);if(data.win&&data.win.winner!=='D')playWin();}if(data.type==='restart'){gameRound=data.round;turn=data.turn;board=Array(9).fill('');gameOver=false;renderOnlineBoard();}if(data.type==='chat'){const d=document.createElement('div');d.style.cssText='max-width:78%;padding:7px 11px;border-radius:14px;font-size:12px;align-self:flex-start;background:rgba(255,255,255,.08)';d.innerHTML=`<b style="font-size:10px;opacity:.6">${data.name}</b><br>${data.text}`;$('chatMsgs').appendChild(d);}});}
function startGameAsHost(){showStep('stepGame');$('p1Name').textContent=myUsername;gameRound=0;initOnlineBoard();}
function initOnlineBoard(){board=Array(9).fill('');turn=(gameRound%2===0)?'X':'O';gameOver=false;renderOnlineBoard();}
function renderOnlineBoard(){const bEl=$('board');bEl.innerHTML='';board.forEach((v,i)=>{const cell=document.createElement('div');cell.className='cell'+(v?' '+v.toLowerCase():'');if(v)cell.textContent=v;else cell.innerHTML='&nbsp;';cell.onclick=()=>{if(board[i]||gameOver)return;if(isHost&&turn!=='X')return;if(!isHost&&turn!=='O')return;board[i]=myMark;if(myMark==='X')playX();else playO();const win=checkWinBoard(board);if(win){gameOver=true;if(win.winner!=='D'){scores[win.winner]++;playWin();}}else turn=turn==='X'?'O':'X';renderOnlineBoard();if(win)checkOnlineWin(win);if(conn&&conn.open)conn.send({type:'move',board:board,turn:turn,gameOver:gameOver,win:win,round:gameRound});};bEl.appendChild(cell);});}
function checkOnlineWin(win){if(!win)return;if(win.line&&win.line.length){[...$('board').children].forEach((el,i)=>{if(win.line.includes(i))el.classList.add('win');});drawWinLine($('board'),win.line);}}
document.querySelectorAll('.emoji').forEach(em=>{em.onclick=()=>{$('chatInput').value+=em.textContent;};});
$('btnLeave').onclick=()=>location.reload();
$('inpUsername').focus();
</script>
</body>
</html>
