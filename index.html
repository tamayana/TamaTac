<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TAMA TAC - Mr.Tama v6.01</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0a0a0f;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;color:#fff;padding:12px}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 20% 30%,#1a1a3a 0%,transparent 60%),radial-gradient(ellipse at 80% 70%,#2a1a2a 0%,transparent 60%),#0a0a0f}
.card{width:100%;max-width:420px;padding:20px;background:rgba(255,255,255,.05);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);border-radius:28px}
h1{font-family:'Playfair Display',serif;font-size:30px;text-align:center;letter-spacing:3px}h1 span{color:#c9a86a}
.sub{text-align:center;color:rgba(255,255,255,.55);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin:6px 0 16px}
.input{width:100%;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:14px;outline:none;margin-bottom:10px;text-align:center}
.btn{width:100%;padding:13px;border-radius:14px;border:1px solid transparent;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-weight:700}
.btn-primary{background:#c9a86a;color:#0a0a0f}
.btn-ghost{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.1);margin-top:8px}
.step{display:none}.step.active{display:block}
.roomCode{font-family:'Playfair Display',serif;font-size:28px;text-align:center;letter-spacing:6px;background:rgba(255,255,255,.05);border:1px dashed rgba(201,168,106,.5);padding:12px;border-radius:16px;margin:12px 0;color:#c9a86a}
.status{text-align:center;padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:12px;margin:10px 0}
.players{display:flex;gap:8px;margin:12px 0}
.player{flex:1;padding:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:14px;text-align:center}
.player.active{background:rgba(201,168,106,.18);border-color:#c9a86a}
.player b{display:block;font-size:12px}.player span{font-size:11px;opacity:.7}
.boardWrap{position:relative;width:100%}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;position:relative;width:100%}
.cell{aspect-ratio:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;cursor:pointer;user-select:none;transition:.15s}
.cell.x{color:#ff3b3b;text-shadow:0 0 10px rgba(255,59,59,.6)}
.cell.o{color:#3b82ff;text-shadow:0 0 10px rgba(59,130,255,.6)}
.cell.win{border-width:2.5px!important}
  .cell.win.x{background:rgba(255,59,59,.25)!important;border-color:#ff3b3b!important;box-shadow:0 0 18px rgba(255,59,59,.6)}
.cell.win.o{background:rgba(59,130,255,.25)!important;border-color:#3b82ff!important;box-shadow:0 0 18px rgba(59,130,255,.6)}
.cell.disabled{opacity:.5;pointer-events:none}
.winLine{position:absolute;background:#fff;box-shadow:0 0 8px #fff,0 0 16px #fff;z-index:10;border-radius:4px;pointer-events:none;height:4px}
.modes{display:flex;gap:6px;margin-bottom:12px;background:rgba(255,255,255,.04);padding:4px;border-radius:12px}
.mode{flex:1;padding:8px 0;border-radius:8px;text-align:center;font-size:10px;cursor:pointer;color:rgba(255,255,255,.5)}
.mode.active{background:#fff;color:#000;font-weight:700}
.btnRow{display:flex;gap:8px;margin-top:12px}
.btnRow .btn{margin:0}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
<div class="step active" id="stepUser">
<h1>TAMA<span>TAC</span></h1><p class="sub">Mr.Tama v6.01</p>
<input id="inpUsername" class="input" placeholder="isi username kamu" maxlength="16" autocomplete="off">
<button class="btn btn-primary" id="btnSaveUser" type="button">MASUK →</button>
</div>
<div class="step" id="stepChoose">
<h1>TAMA<span>TAC</span></h1><p class="sub" id="helloUser">HALO</p>
<button class="btn btn-primary" id="chooseBot">🤖 MAIN VS BOT</button>
<button class="btn btn-ghost" id="chooseOnline">🌐 MAIN ONLINE</button>
</div>
<div class="step" id="stepBot">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h1 style="font-size:20px">TAMA<span>TAC</span></h1><button class="btn btn-ghost" style="width:auto;padding:6px 12px;font-size:10px;margin:0" id="botBack">← MENU</button></div>
<div class="modes"><div class="mode active" data-diff="easy">EASY</div><div class="mode" data-diff="medium">MEDIUM</div><div class="mode" data-diff="hard">HARD</div></div>
<div class="players"><div class="player active" id="botP1"><b id="botP1Name">Kamu</b><span id="botP1Score">X • 0</span></div><div class="player" id="botP2"><b>Bot</b><span id="botP2Score">O • 0</span></div></div>
<div class="status" id="botStatus">Giliran kamu (X)</div>
<div class="boardWrap"><div class="board" id="botBoard"></div></div>
<div class="btnRow"><button class="btn btn-ghost" id="botUndo">UNDO</button><button class="btn btn-primary" id="botReset">MAIN LAGI</button></div>
</div>
<div class="step" id="stepLobby">
<h1>TAMA<span>TAC</span></h1><p class="sub">Mr.Tama v6.01</p>
<button class="btn btn-primary" id="btnCreate">Buat Room Baru</button>
<div style="display:flex;align-items:center;gap:10px;margin:14px 0;color:rgba(255,255,255,.25);font-size:10px"><div style="flex:1;height:1px;background:rgba(255,255,255,.1)"></div>ATAU<div style="flex:1;height:1px;background:rgba(255,255,255,.1)"></div></div>
<input id="inpRoom" class="input" placeholder="kode room teman..." maxlength="8">
<button class="btn btn-ghost" id="btnJoin">Join Room</button>
<button class="btn btn-ghost" id="lobbyBack" style="background:none;border:none;color:rgba(255,255,255,.4)">← Kembali</button>
</div>
<div class="step" id="stepWait">
<h1 style="font-size:22px">TAMA<span>TAC</span></h1><p class="sub">Share kode ke teman</p>
<div class="roomCode" id="roomCodeDisplay">------</div>
<div class="btnRow"><button class="btn btn-ghost" id="btnCopy">📋 Copy</button><button class="btn btn-ghost" id="waitBack">Batal</button></div>
<div class="status">Menunggu lawan...</div>
<div class="players"><div class="player active"><b id="hostName">Kamu</b><span>HOST • X</span></div><div class="player" style="opacity:.3"><b>Menunggu...</b><span>GUEST • O</span></div></div>
</div>
<div class="step" id="stepGame">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h1 style="font-size:18px">TAMA<span>TAC</span></h1><button class="btn btn-ghost" style="width:auto;padding:6px 10px;font-size:10px;margin:0" id="btnLeave">Keluar</button></div>
<div class="status" id="gameStatus">Menghubungkan...</div>
<div class="players"><div class="player" id="p1Box"><b id="p1Name">Player X</b><span id="p1Mark">X • 0</span></div><div class="player" id="p2Box"><b id="p2Name">Player O</b><span id="p2Mark">O • 0</span></div></div>
<div class="boardWrap"><div class="board" id="board"></div></div>
</div>
</div>
<script>
let myUsername='',peer=null,conn=null,roomId='',isHost=false,myMark='X',turn='X',board=Array(9).fill(''),gameOver=false,scores={X:0,O:0},gameRound=0;
let botBoard=Array(9).fill(''),botTurn='X',botOver=false,botScores={X:0,O:0},botHistory=[],botRound=0;
const $=id=>document.getElementById(id);
let audioCtx=null;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playTik(){ensureAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(1100,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(300,audioCtx.currentTime+0.09);g.gain.setValueAtTime(0.35,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.12);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.12);}
function playWinVoice(){const files=['win.mp3.m4a','win.m4a','win.mp3','win.wav'];let idx=0;function attempt(){if(idx>=files.length){fallbackWin();return;}const a=new Audio(files[idx]);a.volume=0.9;a.play().then(()=>{}).catch(()=>{idx++;attempt();});a.addEventListener('error',()=>{idx++;attempt();},{once:true});}attempt();}
function fallbackWin(){ensureAudio();[523,659,784,1046].forEach((f,i)=>{setTimeout(()=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;g.gain.setValueAtTime(0.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.3);},i*110);});}
function showStep(id){document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}
function checkWin(b){const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(const l of L){const[a,b1,c]=l;if(b[a]&&b[a]===b[b1]&&b[a]===b[c])return{winner:b[a],line:l};}if(b.every(v=>v!==''))return{winner:'D',line:[]};return null;}
function drawLine(boardEl,line){boardEl.querySelectorAll('.winLine').forEach(e=>e.remove());if(!line||line.length!==3)return;const w=boardEl.offsetWidth,gap=8,cellW=(w-gap*2)/3,centers=[];for(let i=0;i<9;i++){const r=Math.floor(i/3),c=i%3;centers[i]={x:c*(cellW+gap)+cellW/2,y:r*(cellW+gap)+cellW/2};}const a=centers[line[0]],c=centers[line[2]],dx=c.x-a.x,dy=c.y-a.y,len=Math.sqrt(dx*dx+dy*dy),ang=Math.atan2(dy,dx)*180/Math.PI;const div=document.createElement('div');div.className='winLine';div.style.width=len+'px';div.style.left=a.x+'px';div.style.top=a.y+'px';div.style.transform='rotate('+ang+'deg)';div.style.transformOrigin='0 50%';boardEl.appendChild(div);}
function initBotBoard(){botBoard=Array(9).fill('');botTurn=(botRound%2===0)?'X':'O';botOver=false;botHistory=[];const boardEl=$('botBoard');boardEl.querySelectorAll('.winLine').forEach(e=>e.remove());renderBotBoard();$('botStatus').textContent=botTurn==='X'?'Giliran kamu (X)':'Bot mulai dulu (O)';if(botTurn==='O')setTimeout(botMove,600);}
function renderBotBoard(){const el=$('botBoard');el.innerHTML='';const win=checkWin(botBoard);const isOver=!!win;botBoard.forEach((v,i)=>{const c=document.createElement('div');c.className='cell'+(v?' '+v.toLowerCase():'')+(isOver?' disabled':'');if(win&&win.line&&win.line.includes(i))c.classList.add('win');c.textContent=v||'';c.onclick=()=>{
  if(botOver||isOver)return;if(botBoard[i]!=='')return;if(botTurn!=='X')return;botHistory.push([...botBoard]);botBoard[i]='X';playTik();const w=checkWin(botBoard);renderBotBoard();if(w){handleBotWin(w);return;}botTurn='O';$('botStatus').textContent='Bot mikir...';$('botP1').classList.remove('active');$('botP2').classList.add('active');setTimeout(botMove,500);};el.appendChild(c);});if(win&&win.line)drawLine(el,win.line);$('botP1').classList.toggle('active',botTurn==='X'&&!botOver);$('botP2').classList.toggle('active',botTurn==='O'&&!botOver);}
function handleBotWin(win){botOver=true;if(win.winner==='D'){$('botStatus').textContent='Seri! 🤝';}else{botScores[win.winner]++;$('botStatus').textContent=(win.winner==='X'?myUsername+' MENANG!':'BOT MENANG!')+' 🔥';playWinVoice();}$('botP1Score').textContent='X • '+botScores.X;$('botP2Score').textContent='O • '+botScores.O;}
function botMove(){if(botOver)return;const w0=checkWin(botBoard);if(w0){handleBotWin(w0);return;}function findMove(player){for(let i=0;i<9;i++){if(botBoard[i]===''){botBoard[i]=player;const w=checkWin(botBoard);botBoard[i]='';if(w&&w.winner===player)return i;}}return null;}let move=findMove('O')||findMove('X');if(move===null){const empties=botBoard.map((v,i)=>v===''?i:null).filter(v=>v!==null);move=empties[Math.floor(Math.random()*empties.length)];}if(move==null)return;botHistory.push([...botBoard]);botBoard[move]='O';playTik();const w=checkWin(botBoard);renderBotBoard();if(w){handleBotWin(w);return;}botTurn='X';$('botStatus').textContent='Giliran kamu (X)';}
document.addEventListener('DOMContentLoaded',()=>{
  const btn=$('btnSaveUser');const inp=$('inpUsername');
  btn.addEventListener('click',()=>{const v=inp.value.trim();if(v.length<2){alert('isi username minimal 2 huruf bung!');inp.focus();return;}myUsername=v;$('helloUser').textContent='HALO, '+myUsername.toUpperCase();showStep('stepChoose');});
  inp.addEventListener('keydown',(e)=>{if(e.key==='Enter'){e.preventDefault();btn.click();}});inp.focus();
  $('chooseBot').onclick=()=>{showStep('stepBot');$('botP1Name').textContent=myUsername;botRound=0;botScores={X:0,O:0};$('botP1Score').textContent='X • 0';$('botP2Score').textContent='O • 0';initBotBoard();};
  $('chooseOnline').onclick=()=>showStep('stepLobby');
  $('botBack').onclick=()=>showStep('stepChoose');
  $('lobbyBack').onclick=()=>showStep('stepChoose');
  $('waitBack').onclick=()=>{if(peer)try{peer.destroy()}catch(e){};showStep('stepLobby');};
  $('botReset').onclick=()=>{botRound++;initBotBoard();};
  $('botUndo').onclick=()=>{if(!botHistory.length||botOver)return;botBoard=botHistory.pop();botTurn='X';botOver=false;const be=$('botBoard');be.querySelectorAll('.winLine').forEach(e=>e.remove());renderBotBoard();$('botStatus').textContent='Undo - Giliran kamu';};
  document.querySelectorAll('.mode').forEach(m=>{m.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));m.classList.add('active');botRound=0;initBotBoard();};});
  $('btnCreate').onclick=()=>{roomId=Math.random().toString(36).substring(2,8).toUpperCase();isHost=true;myMark='X';gameRound=0;initPeer(roomId);$('roomCodeDisplay').textContent=roomId;$('hostName').textContent=myUsername+' (X)';showStep('stepWait');};
  $('btnCopy').onclick=()=>{navigator.clipboard.writeText($('roomCodeDisplay').textContent).then(()=>{$('btnCopy').textContent='✅ Copied';setTimeout(()=>{$('btnCopy').textContent='📋 Copy'},1200);});};
  $('btnJoin').onclick=()=>{const code=$('inpRoom').value.trim().toUpperCase();if(!code){alert('isi kode room!');return;}roomId=code;isHost=false;myMark='O';initPeer();};
    function initPeer(customId){if(peer)try{peer.destroy()}catch(e){}peer=customId?new Peer(customId):new Peer();peer.on('open',id=>{if(!isHost){const c=peer.connect(roomId,{reliable:true});setupConn(c);$('gameStatus').textContent='Menyambung...';showStep('stepGame');}});peer.on('connection',c=>{if(isHost)setupConn(c);});peer.on('error',e=>{alert(e.message);showStep('stepLobby');});}
  function setupConn(c){conn=c;conn.on('open',()=>{if(isHost){setTimeout(()=>{conn.send({type:'hello',name:myUsername});},200);startHostGame();}else{conn.send({type:'join',name:myUsername});}});conn.on('data',d=>{handleData(d);});conn.on('close',()=>{$('gameStatus').textContent='Lawan keluar!';});}
  function handleData(d){if(d.type==='join'&&isHost){const guest=d.name;document.querySelector('#stepWait .players').children[1].innerHTML='<b>'+guest+'</b><span>GUEST • O</span>';document.querySelector('#stepWait .players').children[1].style.opacity='1';setTimeout(()=>{showStep('stepGame');$('p1Name').textContent=myUsername;$('p2Name').textContent=guest;initOnlineBoard();},500);}if(d.type==='hello'&&!isHost){$('p1Name').textContent=d.name;$('p2Name').textContent=myUsername;gameRound=0;initOnlineBoard();}if(d.type==='move'){board=d.board;turn=d.turn;gameOver=d.gameOver;renderOnlineBoard();if(d.win)checkOnlineWin(d.win);}if(d.type==='restart'){gameRound=d.round;turn=d.turn;board=Array(9).fill('');gameOver=false;const be=$('board');be.querySelectorAll('.winLine').forEach(e=>e.remove());renderOnlineBoard();$('gameStatus').textContent='Round '+(gameRound+1);}}
  function startHostGame(){showStep('stepGame');$('p1Name').textContent=myUsername;gameRound=0;initOnlineBoard();}
  function initOnlineBoard(){board=Array(9).fill('');turn=(gameRound%2===0)?'X':'O';gameOver=false;const be=$('board');be.querySelectorAll('.winLine').forEach(e=>e.remove());renderOnlineBoard();$('gameStatus').textContent=(gameRound%2===0)?'Host (X) mulai':'Guest (O) mulai';}
  function renderOnlineBoard(){const bEl=$('board');bEl.innerHTML='';const win=checkWin(board);board.forEach((v,i)=>{const cell=document.createElement('div');cell.className='cell'+(v?' '+v.toLowerCase():'')+(gameOver||win?' disabled':'');if(win&&win.line&&win.line.includes(i))cell.classList.add('win');cell.textContent=v||'';const canPlay=!gameOver&&!win&&((isHost&&turn==='X')||(!isHost&&turn==='O'));if(!canPlay)cell.classList.add('disabled');cell.onclick=()=>{if(board[i]||gameOver||win)return;if(isHost&&turn!=='X')return;if(!isHost&&turn!=='O')return;board[i]=myMark;playTik();const w=checkWin(board);if(w){gameOver=true;if(w.winner!=='D'){scores[w.winner]++;playWinVoice();}}else{turn=turn==='X'?'O':'X';}renderOnlineBoard();if(w)checkOnlineWin(w);if(conn&&conn.open)conn.send({type:'move',board:board,turn:turn,gameOver:gameOver,win:w,round:gameRound});};bEl.appendChild(cell);});if(win&&win.line)drawLine(bEl,win.line);$('p1Box').classList.toggle('active',turn==='X');$('p2Box').classList.toggle('active',turn==='O');$('p1Mark').textContent='X • '+scores.X;$('p2Mark').textContent='O • '+scores.O;}
  function checkOnlineWin(win){if(!win)return;if(win.winner==='D')$('gameStatus').textContent='Seri!';else $('gameStatus').textContent=win.winner+' MENANG! 🔥';}
  $('btnLeave').onclick=()=>location.reload();
});
</script>
</body>
</html>
