<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>TAMA V0.5.3</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#07070b;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;color:#fff;padding:16px}
.card{width:100%;max-width:400px;padding:24px;background:rgba(255,255,255,.05);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.08);border-radius:32px}
h1{font-family:'Playfair Display',serif;font-size:34px;text-align:center;letter-spacing:4px}h1 i{color:#c9a86a}
.sub{text-align:center;color:rgba(255,255,255,.45);font-size:10px;letter-spacing:3px;margin:8px 0 18px}
.input{width:100%;padding:16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:16px;text-align:center;outline:none;margin-bottom:10px}
.btn{width:100%;padding:16px;border-radius:16px;border:0;font-size:12px;letter-spacing:2px;font-weight:700;cursor:pointer}
.btn-gold{background:linear-gradient(135deg,#c9a86a,#e8c99a);color:#000}
.btn-dark{background:rgba(255,255,255,.08);color:#fff;margin-top:10px;border:1px solid rgba(255,255,255,.1)}
.step{display:none}.step.show{display:block}
.room{font-size:32px;text-align:center;letter-spacing:6px;padding:16px;border:1px dashed #c9a86a;border-radius:20px;margin:14px 0;color:#c9a86a;font-family:'Playfair Display',serif}
.status{text-align:center;padding:12px;background:rgba(255,255,255,.05);border-radius:16px;font-size:12px;margin:12px 0}
.players{display:flex;gap:10px;margin:14px 0}
.pl{flex:1;padding:12px;background:rgba(255,255,255,.04);border-radius:18px;text-align:center;border:1px solid rgba(255,255,255,.06)}
.pl.on{border-color:#c9a86a;background:rgba(201,168,106,.15)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{aspect-ratio:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;cursor:pointer;font-family:'Playfair Display',serif}
.cell.x{color:#ff5a5a}.cell.o{color:#5a8aff}.cell.win{box-shadow:0 0 20px currentColor;border-color:currentColor!important}
.dot{width:6px;height:6px;background:#0f0;border-radius:50%;display:inline-block;margin-right:6px;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="card">
<div class="step show" id="sUser"><h1>TAMA <i>V0.5.3</i></h1><p class="sub">BOT + ONLINE JARAK JAUH</p><input id="inpUser" class="input" placeholder="username" maxlength="12"><button class="btn btn-gold" id="btnUser">MASUK →</button></div>
<div class="step" id="sMenu"><h1>TAMA <i>V0.5.3</i></h1><p class="sub" id="hiUser">HALO</p><button class="btn btn-gold" id="btnBot">🤖 VS BOT PINTAR</button><button class="btn btn-dark" id="btnOnline">🌐 ONLINE JARAK JAUH</button></div>

<!-- BOT -->
<div class="step" id="sBot">
<div style="display:flex;justify-content:space-between"><h1 style="font-size:20px">TAMA <i>V0.5.3</i></h1><button class="btn btn-dark" style="width:auto;padding:8px 12px;margin:0" id="bBack">MENU</button></div>
<div class="players"><div class="pl on" id="bp1"><b id="bp1n">Kamu</b><span id="bp1s">X 0</span></div><div class="pl" id="bp2"><b>BOT</b><span id="bp2s">O 0</span></div></div>
<div class="status" id="bStatus">Giliran kamu (X)</div>
<div class="board" id="bBoard"></div>
<div style="display:flex;gap:10px;margin-top:14px"><button class="btn btn-dark" style="margin:0" id="bUndo">↩ UNDO</button><button class="btn btn-gold" style="margin:0" id="bReset">MAIN LAGI</button></div>
</div>

<!-- ONLINE -->
<div class="step" id="sLobby"><h1>TAMA <i>V0.5.3</i></h1><p class="sub">SERVER SG AKTIF - PONTIANAK</p><button class="btn btn-gold" id="btnCreate">BUAT ROOM BARU</button><input id="inpRoom" class="input" placeholder="kode room" style="margin-top:14px"><button class="btn btn-dark" id="btnJoin">JOIN ROOM</button><button class="btn btn-dark" style="background:none;border:0" id="lBack">← Kembali</button></div>
<div class="step" id="sWait"><h1 style="font-size:22px">TAMA <i>V0.5.3</i></h1><p class="sub">KODE ROOM - SHARE KE TEMAN</p><div class="room" id="roomCode">------</div><div style="display:flex;gap:10px"><button class="btn btn-dark" style="margin:0" id="btnCopy">COPY KODE</button><button class="btn btn-dark" style="margin:0" id="wBack">BATAL</button></div><div class="status" id="wStatus"><span class="dot"></span>Room aktif!</div></div>
<div class="step" id="sGame"><div style="display:flex;justify-content:space-between"><h1 style="font-size:18px">TAMA <i>V0.5.3</i></h1><button class="btn btn-dark" style="width:auto;padding:6px 10px;margin:0" id="gLeave">Keluar</button></div><div class="status" id="gStatus">Sinkron...</div><div class="players"><div class="pl" id="gp1"><b id="gp1n">X</b><span id="gp1s">X 0</span></div><div class="pl" id="gp2"><b id="gp2n">O</b><span id="gp2s">O 0</span></div></div><div class="board" id="gBoard"></div><button class="btn btn-gold" id="btnRematch" style="display:none;margin-top:14px">🔄 MAIN LAGI</button></div>
</div>

<script>
const $=id=>document.getElementById(id);
let username='', roomId='', myMark='X', board=Array(9).fill(''), turn='X', scores={X:0,O:0}, evtSource=null;
let bBoard=Array(9).fill(''), bTurn='X', bOver=false, bScores={X:0,O:0}, bHist=[], bRound=0;
let audio=null;
function initAudio(){ if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==='suspended') audio.resume(); }
function sound(t){ try{ if(!audio) return; const o=audio.createOscillator(),g=audio.createGain(); o.connect(g); g.connect(audio.destination); const n=audio.currentTime; if(t==='x'){o.frequency.value=440;g.gain.setValueAtTime(.25,n);g.gain.linearRampToValueAtTime(.01,n+.15);o.start(n);o.stop(n+.15);} if(t==='o'){o.frequency.value=660;g.gain.setValueAtTime(.25,n);g.gain.linearRampToValueAtTime(.01,n+.15);o.start(n);o.stop(n+.15);} if(t==='win'){o.frequency.value=523;o.start(n);o.stop(n+.2);setTimeout(()=>{let o2=audio.createOscillator(),g2=audio.createGain();o2.connect(g2);g2.connect(audio.destination);o2.frequency.value=784;g2.gain.setValueAtTime(.3,audio.currentTime);o2.start();o2.stop(audio.currentTime+.3)},150);} if(t==='draw'){o.frequency.value=150;o.type='sawtooth';o.start(n);o.stop(n+.4);} if(t==='click'){o.frequency.value=800;g.gain.setValueAtTime(.15,n);o.start(n);o.stop(n+.07);} }catch(e){} }
function show(id){ document.querySelectorAll('.step').forEach(s=>s.classList.remove('show')); $(id).classList.add('show'); }
function winCheck(b){ const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; for(let l of L){ if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[0]]===b[l[2]]) return {w:b[l[0]],line:l}; } if(b.every(v=>v)) return {w:'D'}; return null; }

// ===== BOT =====
function initBot(){ bBoard=Array(9).fill(''); bTurn=bRound%2===0?'X':'O'; bOver=false; bHist=[]; renderBot(); $('bStatus').textContent=bTurn==='X'?'Giliran kamu (X)':'Bot mulai (O)'; if(bTurn==='O') setTimeout(botMove,600); }
function renderBot(){ const el=$('bBoard'); el.innerHTML=''; const win=winCheck(bBoard); bBoard.forEach((v,i)=>{ let d=document.createElement('div'); d.className='cell '+(v?v.toLowerCase():''); if(win&&win.line&&win.line.includes(i)) d.classList.add('win'); d.textContent=v; d.onclick=()=>{ if(bOver||win||bBoard[i]||bTurn!=='X') return; bHist.push([...bBoard]); bBoard[i]='X'; initAudio(); sound('x'); let w=winCheck(bBoard); renderBot(); if(w){botEnd(w);return;} bTurn='O'; $('bStatus').textContent='Bot mikir...'; setTimeout(botMove,500); }; el.appendChild(d); }); $('bp1').classList.toggle('on',bTurn==='X'); $('bp2').classList.toggle('on',bTurn==='O'); }
function botEnd(w){ bOver=true; if(w.w!=='D') bScores[w.w]++; if(w.w==='D'){sound('draw');$('bStatus').textContent='🤝 Seri!';}else{sound('win');$('bStatus').textContent=w.w+' MENANG!';} $('bp1s').textContent='X '+bScores.X; $('bp2s').textContent='O '+bScores.O; }
function botMove(){ if(bOver) return; let w=winCheck(bBoard); if(w){botEnd(w);return;} function find(p){ for(let i=0;i<9;i++){ if(!bBoard[i]){ bBoard[i]=p; let r=winCheck(bBoard); bBoard[i]=''; if(r&&r.w===p) return i; } } return null; } let m=find('O')||find('X'); if(m===null){ let e=bBoard.map((v,i)=>!v?i:null).filter(v=>v!==null); m=e[Math.floor(Math.random()*e.length)]; } bHist.push([...bBoard]); bBoard[m]='O'; initAudio(); sound('o'); w=winCheck(bBoard); renderBot(); if(w){botEnd(w);return;} bTurn='X'; $('bStatus').textContent='Giliran kamu'; }

// ===== ONLINE NTFY =====
function renderOn(){ const el=$('gBoard'); el.innerHTML=''; const win=winCheck(board); board.forEach((v,i)=>{ let d=document.createElement('div'); d.className='cell '+(v?v.toLowerCase():''); if(win&&win.line&&win.line.includes(i)) d.classList.add('win'); d.textContent=v; let myTurn=myMark===turn; if(!myTurn||win) d.style.opacity='.5'; d.onclick=()=>{ if(board[i]||win||!myTurn) return; board[i]=myMark; initAudio(); sound(myMark==='X'?'x':'o'); let w=winCheck(board); if(w&&w.w!=='D') scores[w.w]++; renderOn(); sendState(); }; el.appendChild(d); }); $('gp1').classList.toggle('on',turn==='X'); $('gp2').classList.toggle('on',turn==='O'); $('gp1s').textContent='X '+scores.X; $('gp2s').textContent='O '+scores.O; if(win){ $('gStatus').textContent=win.w==='D'?'🤝 Seri!':'🏆 '+win.w+' MENANG!'; $('btnRematch').style.display='block'; if(win.w==='D') sound('draw'); else sound('win'); } else { $('gStatus').textContent='Giliran '+turn+' (Kamu '+myMark+')'; } }
function topic(){ return 'tama-pontianak-v053-'+roomId; }
async function sendState(){ const payload={board:board,turn:turn==='X'?'O':'X',scores:scores,lastMark:myMark,from:username}; try{ await fetch('https://ntfy.sh/'+topic(),{method:'POST',body:JSON.stringify(payload)}); }catch(e){} turn=payload.turn; renderOn(); }
function startListen(){ if(evtSource) evtSource.close(); evtSource=new EventSource('https://ntfy.sh/'+topic()+'/sse'); evtSource.onmessage=(e)=>{ try{ const d=JSON.parse(e.data); if(d.message){ const p=JSON.parse(d.message); if(p.from===username) return; if(p.board){ if(p.lastMark&&p.lastMark!==myMark){ initAudio(); sound(p.lastMark==='X'?'x':'o'); } board=p.board; turn=p.turn; scores=p.scores||scores; renderOn(); if($('sWait').classList.contains('show')) show('sGame'); } if(p.type==='join'){ $('gp2n').textContent=p.from; fetch('https://ntfy.sh/'+topic(),{method:'POST',body:JSON.stringify({p1:username,p2:p.from,type:'joined'})}); show('sGame'); } } }catch(err){} }; }

document.addEventListener('DOMContentLoaded',()=>{
 $('btnUser').addEventListener('click',()=>{ const v=$('inpUser').value.trim(); if(v.length<2){alert('Username min 2');return;} username=v; $('hiUser').textContent='HALO '+v.toUpperCase(); show('sMenu'); try{initAudio();sound('click');}catch(e){} });
 $('btnBot').addEventListener('click',()=>{ show('sBot'); $('bp1n').textContent=username; initBot(); try{sound('click')}catch(e){} });
 $('btnOnline').addEventListener('click',()=>show('sLobby'));
 $('bBack').addEventListener('click',()=>show('sMenu'));
 $('lBack').addEventListener('click',()=>show('sMenu'));
 $('wBack').addEventListener('click',()=>{ if(evtSource) evtSource.close(); show('sLobby'); });
 $('gLeave').addEventListener('click',()=>{ if(evtSource) evtSource.close(); location.reload(); });
 $('bReset').addEventListener('click',()=>{ bRound++; initBot(); try{sound('click')}catch(e){} });
 $('bUndo').addEventListener('click',()=>{ if(!bHist.length||bOver) return; bBoard=bHist.pop(); bTurn='X'; bOver=false; renderBot(); $('bStatus').textContent='Giliran kamu'; });
 $('btnCreate').addEventListener('click',()=>{ roomId=Math.random().toString(36).substring(2,6).toUpperCase(); myMark='X'; board=Array(9).fill(''); turn='X'; scores={X:0,O:0}; $('roomCode').textContent=roomId; $('gp1n').textContent=username; $('gp2n').textContent='Menunggu...'; show('sWait'); $('wStatus').innerHTML='<span class="dot"></span>✅ Room '+roomId+' AKTIF! Share kode ini!'; startListen(); try{initAudio();sound('click');}catch(e){} });
 $('btnCopy').addEventListener('click',()=>{ navigator.clipboard.writeText($('roomCode').textContent); $('btnCopy').textContent='COPIED!'; setTimeout(()=>$('btnCopy').textContent='COPY KODE',1000); });
 $('btnJoin').addEventListener('click',()=>{ const c=$('inpRoom').value.trim().toUpperCase(); if(!c){alert('Isi kode');return;} roomId=c; myMark='O'; show('sGame'); $('gStatus').textContent='Join '+c+'...'; $('gp1n').textContent='Host'; $('gp2n').textContent=username; startListen(); setTimeout(()=>{ fetch('https://ntfy.sh/'+topic(),{method:'POST',body:JSON.stringify({type:'join',from:username})}); },800); });
 $('btnRematch').addEventListener('click',()=>{ board=Array(9).fill(''); turn='X'; renderOn(); sendState(); $('btnRematch').style.display='none'; });
});
</script>
</body>
</html>
