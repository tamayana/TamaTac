<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Mr.Tama v6.1</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet"><script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:#0a0a0f;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;color:#fff}.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 20% 30%,#1a1a3a 0%,transparent 60%),radial-gradient(ellipse at 80% 70%,#2a1a2a 0%,transparent 60%),#0a0a0f}.card{width:100%;max-width:460px;padding:24px;background:rgba(255,255,255,.04);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);border-radius:28px}h1{font-family:'Playfair Display',serif;font-size:32px;text-align:center;letter-spacing:2px}h1 span{color:#c9a86a}.sub{text-align:center;color:rgba(255,255,255,.4);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin:4px 0 18px}.input{width:100%;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:14px;outline:none;margin-bottom:10px;text-align:center}.btn{width:100%;padding:13px;border-radius:14px;border:1px solid transparent;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-weight:600}.btn-primary{background:#c9a86a;color:#0a0a0f}.btn-ghost{background:rgba(255,255,255,.05);color:#fff;border-color:rgba(255,255,255,.1);margin-top:8px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px;position:relative}.cell{aspect-ratio:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;cursor:pointer}.cell.x{color:#ff3b3b}.cell.o{color:#3b82ff}.step{display:none}.step.active{display:block}</style></head><body><div class="bg"></div><div class="card"><div class="step active" id="stepUser"><h1>MR.<span>TAMA</span></h1><p class="sub">v6.1 • Tik + Menang Bosku</p><input id="inpUsername" class="input" placeholder="isi username kamu" maxlength="16"><button class="btn btn-primary" id="btnSaveUser" type="button">MASUK →</button></div><div class="step" id="stepChoose"><h1>MR.<span>TAMA</span></h1><p class="sub" id="helloUser">HALO</p><button class="btn btn-primary" id="chooseBot">MAIN VS BOT</button><button class="btn btn-ghost" id="chooseOnline">MAIN ONLINE</button></div> 
  <div class="step" id="stepBot"><h1 style="font-size:22px">VS BOT</h1><button id="botBack">←</button><div class="players"><div id="botP1"><b id="botP1Name">Kamu</b><span id="botP1Score">X • 0</span></div><div id="botP2"><b>Bot</b><span id="botP2Score">O • 0</span></div></div><div id="botStatus">Giliran kamu (X)</div><div class="board" id="botBoard"></div><button id="botUndo">UNDO</button><button id="botReset">MAIN LAGI</button></div><div class="step" id="stepLobby"><h1>MR.<span>TAMA</span></h1><button id="btnCreate">Buat Room Baru</button><input id="inpRoom" class="input" placeholder="kode room teman..."><button id="btnJoin">Join Room</button><button id="lobbyBack">← Kembali</button></div><div class="step" id="stepWait"><h1>Room Dibuat</h1><div id="roomCodeDisplay">------</div><button id="btnCopy">Copy</button><button id="waitBack">Batal</button></div><div class="step" id="stepGame"><h1>MR.TAMA</h1><button id="btnLeave">Keluar</button><div id="gameStatus"></div><div class="board" id="board"></div><div id="chatMsgs"></div><input id="chatInput" placeholder="ketik pesan..."><button id="chatSend">Kirim</button></div></div>
<script>
let myUsername='',peer=null,conn=null,roomId='',isHost=false,myMark='X',turn='X',board=Array(9).fill(''),gameOver=false,scores={X:0,O:0},gameRound=0;let botBoard=Array(9).fill(''),botTurn='X',botOver=false,botScores={X:0,O:0},botHistory=[],botRound=0;const $=id=>document.getElementById(id);let audioCtx=null;function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playTik(){ensureAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(1200,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(400,audioCtx.currentTime+0.08);g.gain.setValueAtTime(0.4,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.12);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.12);}
function playWinVoice(){const f=['win.mp3.m4a','win.m4a','win.mp3'];let i=0;function at(){if(i>=f.length)return;const a=new Audio(f[i]);a.volume=0.9;a.play().catch(()=>{i++;at();});a.onerror=()=>{i++;at();};}at();} 
  function showStep(id){document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}
function checkWinBoard(b){const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(const l of L){const[a,b1,c]=l;if(b[a]&&b[a]===b[b1]&&b[a]===b[c])return{winner:b[a],line:l};}if(b.every(v=>v!==''))return{winner:'D',line:[]};return null;}
function initBotBoard(){botBoard=Array(9).fill('');botTurn=(botRound%2===0)?'X':'O';botOver=false;botHistory=[];renderBotBoard();$('botStatus').textContent=botTurn==='X'?'Giliran kamu (X)':'Bot mulai';if(botTurn==='O')setTimeout(botMove,600);}
function renderBotBoard(){const el=$('botBoard');el.innerHTML='';botBoard.forEach((v,i)=>{const c=document.createElement('div');c.className='cell'+(v?' '+v.toLowerCase():'');c.textContent=v||'';c.onclick=()=>{if(botBoard[i]||botOver||botTurn!=='X')return;botHistory.push([...botBoard]);botBoard[i]='X';playTik();let w=checkWinBoard(botBoard);renderBotBoard();if(w){botOver=true;if(w.winner!=='D'){botScores[w.winner]++;playWinVoice();}return;}botTurn='O';setTimeout(botMove,400);};el.appendChild(c);});}
function botMove(){let e=botBoard.map((v,i)=>v==='' ? i : null).filter(v=>v!==null);let m=e[Math.floor(Math.random()*e.length)];botBoard[m]='O';playTik();let w=checkWinBoard(botBoard);renderBotBoard();if(w){botOver=true;if(w.winner!=='D'){botScores[w.winner]++;playWinVoice();}return;}botTurn='X';}
document.addEventListener('DOMContentLoaded',()=>{
const btn=document.getElementById('btnSaveUser');const inp=document.getElementById('inpUsername');
btn.addEventListener('click',()=>{
const v=inp.value.trim();if(v.length<2){alert('isi username minimal 2 huruf bung!');inp.focus();return;}
myUsername=v;document.getElementById('helloUser').textContent='HALO, '+myUsername.toUpperCase();showStep('stepChoose');
});
inp.addEventListener('keydown',(e)=>{if(e.key==='Enter'){e.preventDefault();btn.click();}});
inp.focus();
$('chooseBot').onclick=()=>{showStep('stepBot');$('botP1Name').textContent=myUsername;botRound=0;initBotBoard();};
$('chooseOnline').onclick=()=>showStep('stepLobby');
$('botBack').onclick=()=>showStep('stepChoose');
$('lobbyBack').onclick=()=>showStep('stepChoose');
$('waitBack').onclick=()=>showStep('stepLobby');
$('botReset').onclick=()=>{botRound++;initBotBoard();};
$('botUndo').onclick=()=>{if(!botHistory.length)return;botBoard=botHistory.pop();botTurn='X';botOver=false;renderBotBoard();};
$('btnCreate').onclick=()=>{roomId=Math.random().toString(36).substring(2,8).toUpperCase();isHost=true;myMark='X';$('roomCodeDisplay').textContent=roomId;showStep('stepWait');initPeer(roomId);};
$('btnJoin').onclick=()=>{const c=$('inpRoom').value.trim().toUpperCase();if(!c){alert('isi kode!');return;}roomId=c;isHost=false;myMark='O';initPeer();showStep('stepGame');};
function initPeer(id){if(peer)try{peer.destroy()}catch(e){}peer=id?new Peer(id):new Peer();peer.on('open',()=>{if(!isHost){const c=peer.connect(roomId);setupConn(c);}});peer.on('connection',c=>setupConn(c));}
function setupConn(c){conn=c;conn.on('open',()=>{conn.send({type:'join',name:myUsername});});conn.on('data',d=>{if(d.type==='move'){board=d.board;renderOnline();}});}
function renderOnline(){const b=$('board');b.innerHTML='';board.forEach((v,i)=>{const c=document.createElement('div');c.className='cell '+(v?v.toLowerCase():'');c.textContent=v; c.onclick=()=>{if(board[i])return;board[i]=myMark;playTik();let w=checkWinBoard(board);if(w&&w.winner!=='D')playWinVoice();renderOnline();if(conn)conn.send({type:'move',board});};b.appendChild(c);});}
});
</script></body></html>
