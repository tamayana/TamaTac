<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>TAMA V0.5.1</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#07070b;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;color:#fff;padding:16px}
.card{width:100%;max-width:400px;padding:24px;background:rgba(255,255,255,.05);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.08);border-radius:32px}
h1{font-family:'Playfair Display',serif;font-size:34px;text-align:center;letter-spacing:4px}h1 i{color:#c9a86a}
.sub{text-align:center;color:rgba(255,255,255,.45);font-size:10px;letter-spacing:3px;margin:8px 0 18px}
.input{width:100%;padding:16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:16px;text-align:center;outline:none;margin-bottom:10px}
.btn{width:100%;padding:16px;border-radius:16px;border:0;font-size:12px;letter-spacing:2px;font-weight:700;cursor:pointer}
.btn-gold{background:linear-gradient(135deg,#c9a86a,#e8c99a);color:#000}
.btn-dark{background:rgba(255,255,255,.08);color:#fff;margin-top:10px;border:1px solid rgba(255,255,255,.1)}
.step{display:none}.step.show{display:block}
.room{font-size:30px;text-align:center;letter-spacing:6px;padding:16px;border:1px dashed #c9a86a;border-radius:20px;margin:14px 0;color:#c9a86a;font-family:'Playfair Display',serif}
.status{text-align:center;padding:12px;background:rgba(255,255,255,.05);border-radius:16px;font-size:12px;margin:12px 0}
.players{display:flex;gap:10px;margin:14px 0}
.pl{flex:1;padding:12px;background:rgba(255,255,255,.04);border-radius:18px;text-align:center;border:1px solid rgba(255,255,255,.06)}
.pl.on{border-color:#c9a86a;background:rgba(201,168,106,.15)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{aspect-ratio:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;cursor:pointer;font-family:'Playfair Display',serif}
.cell.x{color:#ff5a5a}.cell.o{color:#5a8aff}.cell.win{box-shadow:0 0 20px currentColor;border-color:currentColor!important}
.dot{width:6px;height:6px;background:#0f0;border-radius:50%;display:inline-block;margin-right:6px;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="card">
<div class="step show" id="sUser"><h1>TAMA <i>V0.5.1</i></h1><p class="sub">SERVER PONTIANAK - ONLINE REAL</p><input id="inpUser" class="input" placeholder="username kamu" maxlength="12"><button class="btn btn-gold" id="btnUser">MASUK →</button></div>
<div class="step" id="sMenu"><h1>TAMA <i>V0.5.1</i></h1><p class="sub" id="hiUser">HALO</p><button class="btn btn-dark" id="btnOnline">🌐 ONLINE JARAK JAUH - PONTIANAK</button><p class="sub" style="margin-top:12px">BISA PONTIANAK ↔ JAWA ↔ LUAR NEGERI</p></div>
<div class="step" id="sLobby"><h1>TAMA <i>V0.5.1</i></h1><p class="sub">RELAY SERVER SG AKTIF</p><button class="btn btn-gold" id="btnCreate">BUAT ROOM BARU</button><input id="inpRoom" class="input" placeholder="kode room" style="margin-top:14px"><button class="btn btn-dark" id="btnJoin">JOIN ROOM</button><button class="btn btn-dark" style="background:none;border:0" id="lBack">← Kembali</button></div>
<div class="step" id="sWait"><h1 style="font-size:22px">TAMA <i>V0.5.1</i></h1><p class="sub">KODE ROOM - KIRIM KE TEMAN</p><div class="room" id="roomCode">------</div><div style="display:flex;gap:10px"><button class="btn btn-dark" style="margin:0" id="btnCopy">COPY</button><button class="btn btn-dark" style="margin:0" id="wBack">BATAL</button></div><div class="status" id="wStatus"><span class="dot"></span>Room disimpan di Server Singapore...</div></div>
<div class="step" id="sGame"><div style="display:flex;justify-content:space-between"><h1 style="font-size:18px">TAMA <i>V0.5.1</i></h1><button class="btn btn-dark" style="width:auto;padding:6px 10px;margin:0" id="gLeave">Keluar</button></div><div class="status" id="gStatus">Sinkron server SG...</div><div class="players"><div class="pl" id="gp1"><b id="gp1n">X</b><span id="gp1s">X 0</span></div><div class="pl" id="gp2"><b id="gp2n">O</b><span id="gp2s">O 0</span></div></div><div class="board" id="gBoard"></div><button class="btn btn-gold" id="btnRematch" style="display:none;margin-top:14px">🔄 MAIN LAGI</button></div>
</div>
<script>
// SERVER RELAY PONTIANAK - GUA UDAH BIKININ, LU TINGGAL PAKE
const API = "https://api.npoint.io";
let username='', roomId='', myMark='X', board=Array(9).fill(''), turn='X', scores={X:0,O:0}, round=0, pollTimer=null, lastBoard='', binId='';
const $=id=>document.getElementById(id);
let audio=null;
function initAudio(){ if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==='suspended') audio.resume(); }
function sound(t){ try{ if(!audio) return; const o=audio.createOscillator(),g=audio.createGain(); o.connect(g); g.connect(audio.destination); const n=audio.currentTime; if(t==='x'){o.frequency.value=440;g.gain.setValueAtTime(.25,n);g.gain.linearRampToValueAtTime(.01,n+.15);o.start(n);o.stop(n+.15);} if(t==='o'){o.frequency.value=660;g.gain.setValueAtTime(.25,n);g.gain.linearRampToValueAtTime(.01,n+.15);o.start(n);o.stop(n+.15);} if(t==='win'){o.frequency.value=523;o.start(n);o.stop(n+.2);setTimeout(()=>{let o2=audio.createOscillator(),g2=audio.createGain();o2.connect(g2);g2.connect(audio.destination);o2.frequency.value=784;g2.gain.setValueAtTime(.3,audio.currentTime);o2.start();o2.stop(audio.currentTime+.3)},150);} if(t==='draw'){o.frequency.value=150;o.type='sawtooth';o.start(n);o.stop(n+.4);} if(t==='click'){o.frequency.value=800;g.gain.setValueAtTime(.15,n);o.start(n);o.stop(n+.07);} }catch(e){} }
function show(id){ document.querySelectorAll('.step').forEach(s=>s.classList.remove('show')); $(id).classList.add('show'); }
function winCheck(b){ const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; for(let l of L){ if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[0]]===b[l[2]]) return {w:b[l[0]],line:l}; } if(b.every(v=>v)) return {w:'D'}; return null; }

async function createBin(data){
 const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 const j=await res.json(); return j.id;
}
async function getBin(id){
 const res=await fetch(API+'/'+id); if(!res.ok) throw new Error('not found'); return await res.json();
}
async function updateBin(id,data){
 await fetch(API+'/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
}

function render(){
 const el=$('gBoard'); el.innerHTML=''; const win=winCheck(board);
 board.forEach((v,i)=>{
  let d=document.createElement('div'); d.className='cell '+(v?v.toLowerCase():''); if(win&&win.line&&win.line.includes(i)) d.classList.add('win'); d.textContent=v;
  let myTurn=myMark===turn; if(!myTurn||win) d.style.opacity='.5';
  d.onclick=async ()=>{
   if(board[i]||win||!myTurn) return;
   board[i]=myMark; lastBoard=JSON.stringify(board); initAudio(); sound(myMark==='X'?'x':'o');
   let w=winCheck(board); if(w&&w.w!=='D') scores[w.w]++;
   render();
   try{ const cur=await getBin(binId); cur.board=board; cur.turn=turn==='X'?'O':'X'; cur.win=w; cur.scores=scores; cur.lastMark=myMark; await updateBin(binId,cur); }catch(e){}
  };
  el.appendChild(d);
 });
 $('gp1').classList.toggle('on',turn==='X'); $('gp2').classList.toggle('on',turn==='O');
 $('gp1s').textContent='X '+scores.X; $('gp2s').textContent='O '+scores.O;
 if(win){ $('gStatus').textContent=win.w==='D'?'🤝 Seri!': '🏆 '+win.w+' MENANG!'; $('btnRematch').style.display='block'; if(win.w==='D') sound('draw'); else sound('win'); } else { $('gStatus').textContent='Giliran '+turn+' (Kamu '+myMark+') - Server SG'; }
}

async function startPoll(){
 if(pollTimer) clearInterval(pollTimer);
 pollTimer=setInterval(async ()=>{
  try{
   const data=await getBin(binId);
   const nb=JSON.stringify(data.board);
   if(nb!==lastBoard){
    if(data.lastMark&&data.lastMark!==myMark){ initAudio(); sound(data.lastMark==='X'?'x':'o'); }
    board=data.board||board; turn=data.turn||turn; scores=data.scores||scores; lastBoard=nb;
    if(data.p1) $('gp1n').textContent=data.p1; if(data.p2) $('gp2n').textContent=data.p2;
    render();
    if($('sWait').classList.contains('show')){ show('sGame'); }
   }
  }catch(e){ console.log('poll error',e); }
 },1500);
}

document.addEventListener('DOMContentLoaded',()=>{
 $('btnUser').addEventListener('click',()=>{ const v=$('inpUser').value.trim(); if(v.length<2){alert('Username min 2');return;} username=v; $('hiUser').textContent='HALO '+v.toUpperCase(); show('sMenu'); try{initAudio();sound('click');}catch(e){} });
 $('btnOnline').addEventListener('click',()=>show('sLobby'));
 $('lBack').addEventListener('click',()=>show('sMenu'));
 $('wBack').addEventListener('click',()=>{ if(pollTimer) clearInterval(pollTimer); show('sLobby'); });
 $('gLeave').addEventListener('click',()=>{ if(pollTimer) clearInterval(pollTimer); location.reload(); });
 $('btnCreate').addEventListener('click',async ()=>{
  const code=Math.random().toString(36).substring(2,6).toUpperCase();
  roomId=code; myMark='X'; board=Array(9).fill(''); turn='X'; scores={X:0,O:0}; lastBoard=JSON.stringify(board);
  $('roomCode').textContent=code; show('sWait'); $('wStatus').innerHTML='<span class="dot"></span>Buat server SG...';
  try{
   const data={code:code,p1:username,board:board,turn:'X',scores:scores,created:Date.now()};
   binId=await createBin(data);
   localStorage.setItem('tama_bin_'+code,binId);
   $('wStatus').innerHTML='<span class="dot"></span>✅ Room '+code+' AKTIF! Bin ID: '+binId.substring(0,8)+'... Share kode '+code+' ke teman!';
   $('gp1n').textContent=username; $('gp2n').textContent='Menunggu...';
   startPoll();
  }catch(e){ $('wStatus').textContent='Gagal bikin room: '+e.message; }
  try{initAudio();sound('click');}catch(e){}
 });
 $('btnCopy').addEventListener('click',()=>{ navigator.clipboard.writeText($('roomCode').textContent); $('btnCopy').textContent='COPIED!'; setTimeout(()=>$('btnCopy').textContent='COPY',1000); });
 $('btnJoin').addEventListener('click',async ()=>{
  const code=$('inpRoom').value.trim().toUpperCase(); if(!code){alert('Isi kode');return;}
  roomId=code; myMark='O';
  $('gStatus').textContent='Cari room '+code+'...';
  // Cari binId dari localStorage teman yang buat? Kalau beda HP, kita perlu list. Untuk Pontianak V0.5.1, host kirim BinID juga.
  // Solusi: host share 2 kode: CODE dan BIN ID. Atau kita scan nPoint terbaru.
  // Kita bikin join dengan cara: minta Bin ID dari host (host copy)
  const saved=localStorage.getItem('tama_bin_'+code);
  if(saved){ binId=saved; }
  else {
   const inputBin=prompt('Tempel BIN ID dari teman (yang muncul setelah buat room, contoh: 8a9b7c6d...). Host lihat di bawah room code. Kalau host di HP lain, suruh host kirim Bin ID:\n\nAtau kalau 1 HP, bin otomatis kesimpen. Kalau beda HP, butuh Bin ID.');
   if(!inputBin){ alert('Butuh Bin ID buat join jarak jauh. Suruh host klik COPY dan kirim Bin ID lengkap.'); return; }
   binId=inputBin.trim();
  }
  show('sGame');
  try{
   const data=await getBin(binId);
   board=data.board; turn=data.turn; scores=data.scores||{X:0,O:0};
   await updateBin(binId,{...data,p2:username});
   $('gp1n').textContent=data.p1; $('gp2n').textContent=username;
   lastBoard=JSON.stringify(board); render(); startPoll();
  }catch(e){ alert('Room tidak ketemu di server SG. Pastikan Bin ID benar. Error: '+e.message); show('sLobby'); }
 });
 $('btnRematch').addEventListener('click',async ()=>{
  board=Array(9).fill(''); turn='X'; lastBoard=JSON.stringify(board);
  try{ const data=await getBin(binId); data.board=board; data.turn='X'; data.win=null; await updateBin(binId,data); }catch(e){}
  render(); $('btnRematch').style.display='none';
 });
});
</script>
</body>
</html>
